# Prometheus alert rules for logden.
# Wiring: in prometheus.yml -> rule_files: [ "alerts.yml" ].
# Gateway metrics are scraped from :8080/metrics (job=logden), ClickHouse
# metrics from its built-in :9363/metrics (job=clickhouse).
groups:
  - name: logden
    rules:
      - alert: LogdenGatewayDown
        expr: up{job="logden"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "logden target down"
          description: "Gateway not answering scrapes for > 2m."

      - alert: LogdenClickHouseUnreachable
        expr: logden_clickhouse_reachable == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "ClickHouse unreachable from gateway"
          description: "logden_clickhouse_reachable=0 for > 2m — log ingest at risk."

      - alert: LogdenLogsDropped
        expr: increase(logden_logs_dropped_total[5m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Logs being dropped"
          description: "logden_logs_dropped_total is rising — buffer and spool are full."

      - alert: LogdenInsertFailing
        expr: increase(logden_clickhouse_insert_failed_total[5m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "ClickHouse inserts failing"
          description: "Batches are going to the spool; check ClickHouse."

      - alert: LogdenSpoolBacklog
        expr: logden_spool_files > 50
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Spool growing (>50 files for 10m)"
          description: "ClickHouse is likely down for a while — replay can't keep up."

      - alert: LogdenSpoolBytesNearCap
        expr: (logden_spool_bytes / logden_spool_capacity_bytes > 0.8) and logden_spool_capacity_bytes > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Spool >80% of SPOOL_MAX_BYTES"
          description: "Above the cap new batches are dropped. Replay stuck or .bad quarantine files piling up — see RUNBOOK."

      - alert: LogdenRestartLoop
        expr: changes(logden_process_start_time_seconds[15m]) > 2
        labels: { severity: critical }
        annotations:
          summary: "Gateway restarting repeatedly"
          description: "More than 2 process restarts in 15m — likely an OOM kill loop or a crash; check `docker inspect`/`dmesg`."

      - alert: LogdenBufferNearFull
        expr: logden_buffer_events / logden_buffer_capacity > 0.8
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Gateway buffer >80%"
          description: "Backpressure: the worker can't flush to ClickHouse fast enough."

      - alert: LogdenBufferBytesNearFull
        expr: (logden_buffer_bytes / logden_buffer_capacity_bytes > 0.8) and logden_buffer_capacity_bytes > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Gateway buffer >80% of BUFFER_MAX_BYTES"
          description: >-
            With large events the byte budget fills long before the event count does —
            above the cap requests are answered 503 and the events are dropped.

      - alert: LogdenTrafficShed
        expr: increase(logden_logs_rejected_total{reason=~"overloaded|rate_limited"}[5m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Gateway is shedding traffic"
          description: >-
            Requests rejected by admission control (MAX_INFLIGHT_BODY_BYTES) or the rate
            limiter. Clients do not retry, so this is log loss — raise the caps or the limit.

      - alert: LogdenProjectSilent
        expr: increase(logden_project_logs_received_total{project!="<overflow>"}[6h]) == 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "A project stopped sending logs (6h)"
          description: >-
            No events accepted from this project while the gateway keeps ingesting others —
            a dead sender, a wrong token or a broken network path. Only projects seen since
            the last gateway restart are watched; exclude nightly senders with a project!=
            matcher rather than widening the window.

      - alert: LogdenProjectLabelsExhausted
        expr: logden_project_labels_tracked >= logden_project_labels_capacity
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Per-project metrics label cap reached"
          description: >-
            New projects now fold into project="<overflow>", so per-project silence and
            spikes are no longer visible for them. Usually a sender generating a fresh
            project name per event — check the overflow bucket's rate first.

      - alert: LogdenTimestampsRestamped
        expr: increase(logden_logs_restamped_total[15m]) > 100
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Client timestamps being rewritten"
          description: >-
            Events arrive more than 5m in the future or older than RETENTION, so the gateway
            stores its own ingest time and the real event time is lost. Fix the sender's
            clock (reason=future) or raise RETENTION to cover the backfill (reason=too_old).

      - alert: LogdenInsertLatencyHigh
        expr: histogram_quantile(0.99, sum(rate(logden_clickhouse_insert_duration_seconds_bucket[5m])) by (le)) > 2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Insert p99 latency > 2s"
          description: "ClickHouse is slow to accept batches."

  - name: clickhouse
    rules:
      - alert: ClickHouseMemoryNearCap
        expr: ClickHouseAsyncMetrics_MemoryResident > 700e6
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "ClickHouse RSS near the cap"
          description: "RSS close to max_server_memory_usage (768MB) — OOM risk on a 1GB box."

      - alert: ClickHouseDiskLow
        expr: ClickHouseAsyncMetrics_FilesystemMainPathAvailableBytes < 2e9
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Less than 2GB free on the ClickHouse data path"
          description: "Disk is the most likely exhaustion vector on a small VPS: drop old partitions or prune backups — see RUNBOOK (disk full)."
