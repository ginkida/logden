name: logden

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8@sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b
    restart: unless-stopped
    logging: *logging
    mem_limit: 850m
    cpus: "1.5"
    security_opt:
      - "no-new-privileges:true"
    # We don't set cap_drop:[ALL]: the image entrypoint chowns /var/lib/clickhouse
    # (needs CAP_CHOWN) and drops privileges to the clickhouse user itself.
    environment:
      CH_WRITER_PASSWORD: ${CH_WRITER_PASSWORD:?set CH_WRITER_PASSWORD in .env}
      CH_READER_PASSWORD: ${CH_READER_PASSWORD:?set CH_READER_PASSWORD in .env}
    volumes:
      - ch-data:/var/lib/clickhouse
      # memory tuning, profiles, system logs, prometheus, backup
      - ./clickhouse/config.d/low-mem.xml:/etc/clickhouse-server/config.d/low-mem.xml:ro
      - ./clickhouse/config.d/system-logs.xml:/etc/clickhouse-server/config.d/system-logs.xml:ro
      - ./clickhouse/config.d/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
      - ./clickhouse/config.d/backup.xml:/etc/clickhouse-server/config.d/backup.xml:ro
      - ./clickhouse/users.d/low-mem.xml:/etc/clickhouse-server/users.d/low-mem.xml:ro
      # default -> loopback only (for init); access is managed
      - ./docker/clickhouse-access.xml:/etc/clickhouse-server/users.d/access.xml:ro
      # first-start init: schema, then users from env
      - ./clickhouse/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./docker/initdb/20-users.sh:/docker-entrypoint-initdb.d/20-users.sh:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "-q", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    # Ports 8123/9000/9363 are NOT published externally — access only from the docker network.

  gateway:
    build:
      context: ./gateway
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    # Prebuilt image from ghcr instead of a local build: set GATEWAY_IMAGE in .env
    # and bring it up with `docker compose pull gateway && docker compose up -d`.
    image: ${GATEWAY_IMAGE:-logden:latest}
    restart: unless-stopped
    # >= gateway shutdown budget: shCtx(15s) + ceil(BUFFER_SIZE/BATCH_SIZE)*3s drain
    stop_grace_period: 45s
    logging: *logging
    # Average usage is ~15MB; the limit covers the worst case (inflight bodies
    # + byte-capped buffer + GC headroom), so a burst degrades to 503 instead
    # of an OOM kill.
    mem_limit: 128m
    cpus: "0.5"
    read_only: true
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    environment:
      LOG_TOKEN: ${LOG_TOKEN:?set LOG_TOKEN in .env}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: writer
      CLICKHOUSE_PASSWORD: ${CH_WRITER_PASSWORD:?set CH_WRITER_PASSWORD in .env}
      LISTEN_ADDR: ":8080"
      GOMEMLIMIT: 80MiB        # GC ceiling below the cgroup mem_limit 128m (Go doesn't read cgroup mem itself)
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BATCH_SIZE: ${BATCH_SIZE:-500}
      BUFFER_SIZE: ${BUFFER_SIZE:-2000}
      BUFFER_MAX_BYTES: ${BUFFER_MAX_BYTES:-33554432}             # 32MiB byte cap on the buffer
      MAX_INFLIGHT_BODY_BYTES: ${MAX_INFLIGHT_BODY_BYTES:-16777216} # 16MiB of concurrent request bodies
      FLUSH_INTERVAL: ${FLUSH_INTERVAL:-1s}
      SPOOL_DIR: /spool
      SPOOL_MAX_BYTES: ${SPOOL_MAX_BYTES:-268435456}              # 256MiB disk cap for the spool
      REPLAY_INTERVAL: ${REPLAY_INTERVAL:-30s}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-0}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - gw-spool:/spool
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/logden", "-healthcheck"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s
    ports:
      # By default the gateway listens on host loopback only: expose it externally
      # via a TLS reverse-proxy (SECURITY.md) or deliberately with GATEWAY_BIND=0.0.0.0.
      - "${GATEWAY_BIND:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"

volumes:
  ch-data:
  gw-spool:
